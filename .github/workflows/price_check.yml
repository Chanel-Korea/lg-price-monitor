name: Weekly LG Price Monitor

on:
  schedule:
    # 매주 월요일 오전 9시(한국 시간 KST) 자동 실행
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행 스위치

# 로봇이 가격표 CSV 파일을 내 보관함에 직접 저장할 수 있도록 권한 부여
permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 가상 브라우저 패키지 설치
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 가격 모니터링 및 파일 누적 저장
        run: python monitor.py

      - name: 누적된 CSV 파일 깃허브에 업데이트하기
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.csv
          # 변경사항이 있을 때만 저장소에 올리기
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prices: $(date +'%Y-%m-%d')" && git push)
