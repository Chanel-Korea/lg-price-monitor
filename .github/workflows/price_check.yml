name: Weekly LG Price Monitor

on:
  schedule:
    # 한국 시간(KST) 매주 월요일 오전 9시 실행 (UTC 기준 일요일 밤 12시)
    # 만약 브라질 상파울루 시간(BRT) 월요일 오전 9시를 원하시면 '0 12 * * 1'로 변경하세요.
    - cron: '0 0 * * 1'
  workflow_dispatch: # 언제든 수동으로 즉시 실행해볼 수 있는 버튼 활성화

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 가상 브라우저(Playwright) 설치
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: LG 브라질 판가 확인 및 메일 발송
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python monitor.py
